apiVersion: batch/v1
kind: Job
metadata:
  name: conflux-pvc-permission-test
  namespace: team10
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 1
  template:
    metadata:
      name: pvc-test
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: conflux-data-pvc
      containers:
        - name: test-writer
          image: busybox:1.36
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Testing PVC write permissions for uid 10001 ==="
              echo "Current user: $(id)"
              touch /data/.pvc_write_test && echo "Write OK" > /data/.pvc_write_test
              cat /data/.pvc_write_test
              rm -f /data/.pvc_write_test
              echo "PVC permission test PASSED: uid 10001 has write access."
          volumeMounts:
            - name: data-volume
              mountPath: /data

