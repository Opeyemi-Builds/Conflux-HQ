# k8s/secret.example.yaml
#
# DO NOT COMMIT REAL SECRETS OR secret.yaml TO GIT!
#
# To create the secret directly in the Forge namespace using random cryptographic keys,
# run the following command in your terminal:
#
# kubectl create secret generic conflux-secrets \
#   --namespace=team10 \
#   --from-literal=DEMO_TOKEN_SECRET=$(openssl rand -hex 32) \
#   --from-literal=INGESTION_HASH_SECRET=$(openssl rand -hex 32) \
#   --from-literal=PSEUDONYMIZATION_KEY=$(openssl rand -hex 32) \
#   --from-literal=XTRADOT_WEBHOOK_SECRET="<secret-returned-from-xtradot-webhook-registration>"
#
# NOTES ON KEYS:
# 1. PSEUDONYMIZATION_KEY: MUST REMAIN STABLE! Rotating this key changes the customer pseudonym tokens (cust_...),
#    which will break all historical customer joins and repeat-complaint rate analysis.
# 2. XTRADOT_WEBHOOK_SECRET: Returned once when your team registers the webhook with the bank sandbox API.
# 3. INGESTION_HASH_SECRET: Used to HMAC-SHA256 bank connector tokens (cfx_conn_...).
# 4. GATEWAY_KEY: Already provisioned by the Forge platform in the secret 'huawei-gateway' (do not duplicate here).

apiVersion: v1
kind: Secret
metadata:
  name: conflux-secrets-example
  namespace: team10
type: Opaque
stringData:
  DEMO_TOKEN_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  INGESTION_HASH_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  PSEUDONYMIZATION_KEY: "REPLACE_WITH_STABLE_OPENSSL_RAND_HEX_32"
  XTRADOT_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET_FROM_REGISTRATION"

