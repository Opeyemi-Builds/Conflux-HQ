<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<rect x="0" y="0" width="1920" height="8" fill="#1E2761"/>
<!-- header -->
<text x="80" y="78" font-family="Arial" font-size="22" font-weight="bold" letter-spacing="3" fill="#028090">WHY CONFLUXHQ WINS</text>
<text x="80" y="130" font-family="Arial" font-size="46" font-weight="bold" fill="#1E2761">Others see a slice. We see whether money arrived.</text>
<text x="80" y="168" font-family="Arial" font-size="23" fill="#5B6478">Complaints as live telemetry + cause + human-approved fix — delivered as a feed, not another dashboard.</text>

<!-- table frame -->
<g font-family="Arial">
<!-- header row -->
<rect x="80" y="205" width="1760" height="62" rx="12" fill="#1E2761"/>
<text x="110" y="243" font-size="19" font-weight="bold" fill="#FFFFFF" letter-spacing="1">WHO ELSE</text>
<text x="420" y="243" font-size="19" font-weight="bold" fill="#FFFFFF" letter-spacing="1">WHAT THEY SEE</text>
<text x="870" y="243" font-size="19" font-weight="bold" fill="#FFFFFF" letter-spacing="1">WHERE THEY FALL SHORT</text>
<text x="1390" y="243" font-size="19" font-weight="bold" fill="#FFFFFF" letter-spacing="1">CONFLUXHQ EDGE</text>
<!-- col dividers header -->
<line x1="400" y1="205" x2="400" y2="267" stroke="#FFFFFF" stroke-opacity="0.25"/>
<line x1="850" y1="205" x2="850" y2="267" stroke="#FFFFFF" stroke-opacity="0.25"/>
<line x1="1370" y1="205" x2="1370" y2="267" stroke="#FFFFFF" stroke-opacity="0.25"/>

<!-- ROW 1 -->
<rect x="80" y="275" width="1760" height="92" fill="#F7F8FC"/>
<rect x="80" y="275" width="1760" height="92" fill="none" stroke="#E2E6F0"/>
<text x="110" y="305" font-size="19" font-weight="bold" fill="#141A33">APM — Datadog / Grafana</text>
<text x="110" y="330" font-size="17" fill="#5B6478">Servers, uptime, 200 OK</text>
<text x="420" y="305" font-size="18" fill="#141A33">Servers, uptime, 200 OK</text>
<text x="870" y="305" font-size="18" fill="#141A33">Backend green while users are</text>
<text x="870" y="330" font-size="18" fill="#141A33">debited, not credited.</text>
<text x="1390" y="305" font-size="18" font-weight="bold" fill="#028090">Failed-transfer spike vs</text>
<text x="1390" y="330" font-size="18" font-weight="bold" fill="#028090">baseline in minutes.</text>

<!-- ROW 2 -->
<rect x="80" y="367" width="1760" height="92" fill="#FFFFFF"/>
<rect x="80" y="367" width="1760" height="92" fill="none" stroke="#E2E6F0"/>
<text x="110" y="397" font-size="19" font-weight="bold" fill="#141A33">Social listening</text>
<text x="110" y="422" font-size="17" fill="#5B6478">Brandwatch / Sprinklr</text>
<text x="420" y="397" font-size="18" fill="#141A33">Mentions, sentiment</text>
<text x="870" y="397" font-size="18" fill="#141A33">No release / switch cause. No ₦</text>
<text x="870" y="422" font-size="18" fill="#141A33">at-risk rank. English-only.</text>
<text x="1390" y="397" font-size="18" font-weight="bold" fill="#028090">Pidgin, Yoruba, Hausa, Igbo</text>
<text x="1390" y="422" font-size="18" font-weight="bold" fill="#028090">+ cause + severity.</text>

<!-- ROW 3 -->
<rect x="80" y="459" width="1760" height="92" fill="#F7F8FC"/>
<rect x="80" y="459" width="1760" height="92" fill="none" stroke="#E2E6F0"/>
<text x="110" y="489" font-size="19" font-weight="bold" fill="#141A33">Ticketing / CRM</text>
<text x="110" y="514" font-size="17" fill="#5B6478">Zendesk / Freshdesk</text>
<text x="420" y="489" font-size="18" fill="#141A33">One case at a time</text>
<text x="870" y="489" font-size="18" fill="#141A33">Misses pattern across</text>
<text x="870" y="514" font-size="18" fill="#141A33">thousands of cases.</text>
<text x="1390" y="489" font-size="18" font-weight="bold" fill="#028090">Grouped + categorized —</text>
<text x="1390" y="514" font-size="18" font-weight="bold" fill="#028090">patterns compound.</text>

<!-- ROW 4 -->
<rect x="80" y="551" width="1760" height="92" fill="#FFFFFF"/>
<rect x="80" y="551" width="1760" height="92" fill="none" stroke="#E2E6F0"/>
<text x="110" y="581" font-size="19" font-weight="bold" fill="#141A33">Fraud systems</text>
<text x="110" y="606" font-size="17" fill="#5B6478">In-house risk tools</text>
<text x="420" y="581" font-size="18" fill="#141A33">Theft, scams</text>
<text x="870" y="581" font-size="18" fill="#141A33">Misses failed-transaction waves</text>
<text x="870" y="606" font-size="18" fill="#141A33">— today’s pain is failed / delayed.</text>
<text x="1390" y="581" font-size="18" font-weight="bold" fill="#028090">Fraud queue + settlement-</text>
<text x="1390" y="606" font-size="18" font-weight="bold" fill="#028090">failure detection together.</text>

<!-- ROW 5 -->
<rect x="80" y="643" width="1760" height="92" fill="#F7F8FC"/>
<rect x="80" y="643" width="1760" height="92" fill="none" stroke="#E2E6F0"/>
<text x="110" y="673" font-size="19" font-weight="bold" fill="#141A33">Manual monitoring</text>
<text x="110" y="698" font-size="17" fill="#5B6478">Social + call centre</text>
<text x="420" y="673" font-size="18" fill="#141A33">What staff happen to read</text>
<text x="870" y="673" font-size="18" fill="#141A33">3 teams, 3 tools. Trending first,</text>
<text x="870" y="698" font-size="18" fill="#141A33">CBN clock ticking.</text>
<text x="1390" y="673" font-size="18" font-weight="bold" fill="#028090">One feed, 5-sec API poll into</text>
<text x="1390" y="698" font-size="18" font-weight="bold" fill="#028090">the bank’s own dashboard.</text>

<!-- ROW 6 WIN -->
<rect x="80" y="735" width="1760" height="92" rx="12" fill="#EFF8F7" stroke="#028090" stroke-width="2"/>
<text x="110" y="765" font-size="19" font-weight="bold" fill="#1E2761">CONFLUXHQ — early-warning layer</text>
<text x="110" y="790" font-size="17" fill="#028090">Detect with math · Humans approve every naira</text>
<text x="420" y="765" font-size="18" font-weight="bold" fill="#1E2761">Did settlement complete</text>
<text x="420" y="790" font-size="18" font-weight="bold" fill="#1E2761">for users, right now?</text>
<text x="870" y="775" font-size="20" fill="#1E2761">—</text>
<text x="1390" y="765" font-size="18" font-weight="bold" fill="#1E2761">Math flags spike, agent finds</text>
<text x="1390" y="790" font-size="18" font-weight="bold" fill="#1E2761">cause. Full audit log.</text>

<!-- vertical dividers -->
<g stroke="#E2E6F0">
<line x1="400" y1="275" x2="400" y2="827"/>
<line x1="850" y1="275" x2="850" y2="827"/>
<line x1="1370" y1="275" x2="1370" y2="827"/>
</g>

<!-- MOAT -->
<g font-family="Arial">
<rect x="80" y="850" width="425" height="120" rx="12" fill="#1E2761"/>
<text x="102" y="880" font-size="17" font-weight="bold" fill="#7FE3D0" letter-spacing="1">TECHNOLOGY</text>
<text x="102" y="905" font-size="17" fill="#FFFFFF">Median + MAD detection,</text>
<text x="102" y="928" font-size="17" fill="#FFFFFF">rules fallback, HMAC, 403.</text>

<rect x="520" y="850" width="425" height="120" rx="12" fill="#1E2761"/>
<text x="542" y="880" font-size="17" font-weight="bold" fill="#7FE3D0" letter-spacing="1">DATA</text>
<text x="542" y="905" font-size="17" fill="#FFFFFF">Volume + growth + ₦ at-risk.</text>
<text x="542" y="928" font-size="17" fill="#FFFFFF">Sharper per bank, isolated.</text>

<rect x="960" y="850" width="425" height="120" rx="12" fill="#1E2761"/>
<text x="982" y="880" font-size="17" font-weight="bold" fill="#7FE3D0" letter-spacing="1">PARTNERSHIPS</text>
<text x="982" y="905" font-size="17" fill="#FFFFFF">1 pilot → fintechs, telcos,</text>
<text x="982" y="928" font-size="17" fill="#FFFFFF">mobile money → regulator.</text>

<rect x="1400" y="850" width="440" height="120" rx="12" fill="#F96167"/>
<text x="1422" y="880" font-size="17" font-weight="bold" fill="#FFFFFF" letter-spacing="1">COSTS</text>
<text x="1422" y="905" font-size="17" fill="#FFFFFF">SaaS per volume + channels.</text>
<text x="1422" y="928" font-size="17" fill="#FFFFFF">Cheaper than ₦430M fines.</text>
</g>

<text x="80" y="1005" font-family="Arial" font-size="16" fill="#8A93A8">Team Zymic · Track 1 — Payments &amp; Financial Infrastructure</text>
<text x="1840" y="1005" font-family="Arial" font-size="16" fill="#8A93A8" text-anchor="end">NIBSS · CBN 2025 (verify primary table)</text>
</g>
</svg>